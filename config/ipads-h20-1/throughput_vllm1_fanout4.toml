# ======= Shared variables ========
# can be ingested from outside to avoid hard coding
# NOTE: RHS can only expand parameters defined outside ${var-name}
[variables]
model_path = "${model-path}"
blitzdir = "${work-dir}"
tokenizer_path = "${model-path}/tokenizer.json"
vllm_executable = "${venv-path}/bin/vllm serve"
client_executable = "${work-dir}/target/release/client"
base_vllm_port = 59190
dataset_dir = "${dataset-dir}"
log_dir = "${log-dir}"
output_dir = "${output-dir}"
fan-out-times = 4
# ========== 模板定义 ==========
#  "--base-port", "${base_vllm_port}",

# "--no-enable-prefix-caching",
# "--prefix_caching_hash_algo", "sha256",
[app.vllm_template]
executable = ["${vllm_executable}"]
extra_args = [
    "${model_path}",
    "--max-num-batched-tokens",
    "4096",
    "--port",
    "${port}",
    # "--enforce-eager",
    # "--gpu-memory-utilization",
    # "0.5",
    "> ${log_file} 2>&1",
]
