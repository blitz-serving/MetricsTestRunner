# Router config for 16-GPU distributed test

[runtime.raw]
config = [
    { app = "router", envs = { RUST_BACKTRACE = "full", LOG_LEVEL = "info,cache_tracking=info" }, background = false },
]

[variables]
model_path = "${model-path}"
work_dir = "${work-dir}"
work-dir = "${work-dir}"
output_dir = "${output-dir}"

[app.router]
executable = ["${work_dir}/target/release/router"]
extra_args = ["--use-tokenizer"]

[app.router.macro_rules]
"--hostname" = "hostname"
"--port" = "port"
"--client-config" = "cli_stub_cfg"
"--tokenizer-name" = "tokenizer"
"--model-name" = "model"
"--log-path" = "log_path"
"--max-input-length" = "context_length"
"--max-total-tokens" = "total_tokens"
"--max-concurrent-requests" = "concurrent_req"
"--kvcache-block-size" = "block_size"

[app.router.config]
hostname = "localhost"
port = "58009"
model = "${model_path}"
tokenizer = "${model_path}"
cli_stub_cfg = "${work_dir}/exps/blitz-run/configs/config-stubs.json"
log_path = "${output_dir}/router_v2.log"
context_length = 59999
total_tokens = 60000
concurrent_req = 4096
block_size = 16
