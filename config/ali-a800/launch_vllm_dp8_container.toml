# Backend: 8 vLLM instances on GPUs 0-7 (container-relative)
# For 8-GPU sweep: one container with all 8 GPUs

[runtime.raw]
config = [
    { app = "vllm_template", envs = { CUDA_VISIBLE_DEVICES = "0", VLLM_ATTENTION_BACKEND = "FLASHINFER" }, background = true, port_offset = 0 },
    { app = "vllm_template", envs = { CUDA_VISIBLE_DEVICES = "1", VLLM_ATTENTION_BACKEND = "FLASHINFER" }, background = true, port_offset = 1 },
    { app = "vllm_template", envs = { CUDA_VISIBLE_DEVICES = "2", VLLM_ATTENTION_BACKEND = "FLASHINFER" }, background = true, port_offset = 2 },
    { app = "vllm_template", envs = { CUDA_VISIBLE_DEVICES = "3", VLLM_ATTENTION_BACKEND = "FLASHINFER" }, background = true, port_offset = 3 },
    { app = "vllm_template", envs = { CUDA_VISIBLE_DEVICES = "4", VLLM_ATTENTION_BACKEND = "FLASHINFER" }, background = true, port_offset = 4 },
    { app = "vllm_template", envs = { CUDA_VISIBLE_DEVICES = "5", VLLM_ATTENTION_BACKEND = "FLASHINFER" }, background = true, port_offset = 5 },
    { app = "vllm_template", envs = { CUDA_VISIBLE_DEVICES = "6", VLLM_ATTENTION_BACKEND = "FLASHINFER" }, background = true, port_offset = 6 },
    { app = "vllm_template", envs = { CUDA_VISIBLE_DEVICES = "7", VLLM_ATTENTION_BACKEND = "FLASHINFER" }, background = true, port_offset = 7 },
]

[variables]
model_path = "${model-path}"
blitzdir = "${work-dir}"
tokenizer_path = "${model-path}/tokenizer.json"
vllm_executable = "${venv-path}/bin/vllm serve"
base_vllm_port = 8100
output_dir = "${output-dir}"

[app.vllm_template]
executable = ["${vllm_executable}"]
extra_args = [
    "${model_path}",
    "--port", "${port}",
    "--max-model-len", "40960",
    "--max-num-seqs", "256",
    "--block-size", "16",
    "--enable-prefix-caching",
    "--enforce-eager",
    "--gpu-memory-utilization", "0.9",
    "--trust-remote-code",
    "--disable-log-requests",
    "> ${log_file} 2>&1"
]
