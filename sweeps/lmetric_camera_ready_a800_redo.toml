# Camera-ready 7-policy sweep — REDO of policies 2-7.
# Policy 1 (join-shortest-q-weight) data is intact at:
#   /workspace/exps/metro/sf3.9_traceA_camready/20260429093530_join-shortest-q-weight/
# Policies 2-7 need a re-run (Grid 2's client.jsonl got truncated by merge bug,
# now patched in metro/results/collector.py).

[sweep]
name = "lmetric_camera_ready_a800_traceA_redo"
description = "Camera-ready 6-policy redo on qwen_traceA, SF=3.9, Qwen3-30B-A3B 8-GPU DP8"

[sweep.cluster]
profile = "a800-8gpu"
model = "qwen30b"
use_remote = false

[sweep.grid]
scaling_factor = [3.9]
policy = [
    "bailian-impl-q",
    "aibrix-q",
    "dynamo-q",
    "dynamo-decoupled-q",
    "lmetric-q",
    "preble-q",
]

[sweep.configs]
backend = "config/ali-a800/launch_vllm_dp8_container.toml"
router  = "config/ali-a800/vllm_router_8gpu_container.toml"
client  = "config/ali-a800/client_bailian_container.toml"

[sweep.configs.client_overrides]
scale_factor = "${scaling_factor}"

[sweep.execution]
time_in_secs    = 1900
max_retries     = 1
retry_delay_secs = 30
runs_per_combo  = 1

[sweep.output]
store_to_nfs              = false
generate_comparison_plots = true
tag_template              = "sf${scaling_factor}_traceA_camready"
